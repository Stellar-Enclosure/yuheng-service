server:
  port: ${EGON_YUHENG_EDGE_PORT:8443}
  ssl:
    enabled: true
    key-store: ${EGON_YUHENG_EDGE_TLS_KEYSTORE}
    key-store-password: ${EGON_YUHENG_EDGE_TLS_KEYSTORE_PASSWORD}
    key-store-type: PKCS12

spring:
  application:
    name: stellar-enclosure-yuheng-edge-gateway
  security:
    oauth2:
      client:
        registration:
          edge-ui-a:
            provider: edge-issuer-a
            client-id: ${EGON_YUHENG_EDGE_UI_A_CLIENT_ID}
            client-secret: ${EGON_YUHENG_EDGE_UI_A_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_basic
            redirect-uri: "${EGON_YUHENG_EDGE_PUBLIC_ORIGIN}/apps/edge-ui/auth/callback"
            scope: [openid, profile, offline_access]
          edge-ui-b:
            provider: edge-issuer-b
            client-id: ${EGON_YUHENG_EDGE_UI_B_CLIENT_ID}
            client-secret: ${EGON_YUHENG_EDGE_UI_B_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_basic
            redirect-uri: "${EGON_YUHENG_EDGE_PUBLIC_ORIGIN}/apps/edge-ui/auth/callback"
            scope: [openid, profile, offline_access]
          edge-shoubing-a:
            provider: edge-issuer-a
            client-id: ${EGON_YUHENG_EDGE_SHOUBING_A_CLIENT_ID}
            client-secret: ${EGON_YUHENG_EDGE_SHOUBING_A_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_basic
            redirect-uri: "${EGON_YUHENG_EDGE_PUBLIC_ORIGIN}/apps/edge-shoubing/auth/callback"
            scope: [openid, profile, offline_access, tianquan-shoubing:bootstrap:read, tianquan-shoubing:oauth-client:read]
          edge-shoubing-b:
            provider: edge-issuer-b
            client-id: ${EGON_YUHENG_EDGE_SHOUBING_B_CLIENT_ID}
            client-secret: ${EGON_YUHENG_EDGE_SHOUBING_B_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_basic
            redirect-uri: "${EGON_YUHENG_EDGE_PUBLIC_ORIGIN}/apps/edge-shoubing/auth/callback"
            scope: [openid, profile, offline_access, tianquan-shoubing:bootstrap:read, tianquan-shoubing:oauth-client:read]
          edge-jianshen-a:
            provider: edge-issuer-a
            client-id: ${EGON_YUHENG_EDGE_JIANSHEN_A_CLIENT_ID}
            client-secret: ${EGON_YUHENG_EDGE_JIANSHEN_A_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_basic
            redirect-uri: "${EGON_YUHENG_EDGE_PUBLIC_ORIGIN}/apps/edge-jianshen/auth/callback"
