          route-ids: [shoubing-admin, shoubing-admin-browser, edge-shoubing-permission-snapshot-browser, edge-shoubing-field-catalog-browser]
          request-paths: [/api/v1/tianquan-shoubing/**, /apps/edge-shoubing/api/v1/authorization/effective-permissions, /apps/edge-shoubing/api/v1/authorization/field-catalog]
