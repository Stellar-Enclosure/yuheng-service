          password: ${EGON_YUHENG_EDGE_OAUTH_DB_PASSWORD}
          maximum-pool-size: 8
          queued-tasks: 200
          transaction-timeout-seconds: 5
        encryption:
          active-key-id: v1
          key-files:
            v1: ${EGON_YUHENG_EDGE_OAUTH_STATE_KEY_FILE}
      identity-authority:
        app-id: stellar-enclosure-yuheng-edge-gateway
