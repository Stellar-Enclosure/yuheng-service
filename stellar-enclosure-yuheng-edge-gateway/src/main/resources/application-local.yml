            "[${EGON_YUHENG_EDGE_OIDC_ISSUER}]": edge-jianshen-a
            "[${EGON_YUHENG_EDGE_OIDC_B_ISSUER}]": edge-jianshen-b
          route-ids: [jianshen-admin, jianshen-about, jianshen-admin-browser, jianshen-about-browser, jianshen-permission-catalog-browser, edge-jianshen-field-catalog-browser]
          request-paths: [/api/tianquan-jianshen/v1/**, /api/v1/auth/about, /api/v1/authorization/effective-permissions, /api/v1/permission-catalogs/**, /api/v1/roles/**, /apps/edge-jianshen/api/v1/authorization/field-catalog]
