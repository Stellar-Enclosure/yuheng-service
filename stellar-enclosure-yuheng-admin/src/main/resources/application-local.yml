spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/egon_gateway_local}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:HomeLab666}

yuheng:
  admin:
    cache:
      redis:
        address: ${YUHENG_ADMIN_CACHE_REDIS_ADDRESS}
        database: ${YUHENG_ADMIN_CACHE_REDIS_DATABASE:0}
        password-file: ${YUHENG_ADMIN_CACHE_REDIS_PASSWORD_FILE:}
    openapi:
      enabled: ${YUHENG_ADMIN_OPENAPI_ENABLED:false}
      allow-development-http: ${YUHENG_ADMIN_OPENAPI_ALLOW_DEVELOPMENT_HTTP:false}
      reconcile-delay: ${YUHENG_ADMIN_OPENAPI_RECONCILE_DELAY:PT30S}
      batch-size: ${YUHENG_ADMIN_OPENAPI_BATCH_SIZE:50}
      maximum-instance-attempts: ${YUHENG_ADMIN_OPENAPI_MAX_INSTANCE_ATTEMPTS:3}
      claim-timeout: ${YUHENG_ADMIN_OPENAPI_CLAIM_TIMEOUT:PT2M}
      connect-timeout: ${YUHENG_ADMIN_OPENAPI_CONNECT_TIMEOUT:PT3S}
      read-timeout: ${YUHENG_ADMIN_OPENAPI_READ_TIMEOUT:PT10S}
      maximum-document-bytes: ${YUHENG_ADMIN_OPENAPI_MAX_DOCUMENT_BYTES:5242880}
      maximum-operations: ${YUHENG_ADMIN_OPENAPI_MAX_OPERATIONS:5000}
      maximum-schema-nodes: ${YUHENG_ADMIN_OPENAPI_MAX_SCHEMA_NODES:50000}
      maximum-ref-depth: ${YUHENG_ADMIN_OPENAPI_MAX_REF_DEPTH:64}
      retry-initial-delay: ${YUHENG_ADMIN_OPENAPI_RETRY_INITIAL_DELAY:PT5S}
      retry-maximum-delay: ${YUHENG_ADMIN_OPENAPI_RETRY_MAXIMUM_DELAY:PT5M}
      retry-jitter: ${YUHENG_ADMIN_OPENAPI_RETRY_JITTER:0.20}
      drift-sample-interval: ${YUHENG_ADMIN_OPENAPI_DRIFT_SAMPLE_INTERVAL:PT5M}
      allowed-cidrs:
        - ${YUHENG_ADMIN_OPENAPI_ALLOWED_CIDR:127.0.0.1/32}
      required-scope: ${YUHENG_ADMIN_OPENAPI_REQUIRED_SCOPE:yuheng.openapi.read}

egon:
  cola:
    platform:
      tianquan:
        shoubing:
          usage-observation:
            enabled: true
            receiver: YUHENG_ADMIN
            fallback-issuer: ${TIANQUAN_SHOUBING_OAUTH_ISSUER}
            allow-local-plaintext: true
          authority:
            base-uri: ${TIANQUAN_SHOUBING_AUTHORITY_BASE_URI}
            timeout: PT2S
            bindings:
              tenant-a:
                issuer: ${TIANQUAN_SHOUBING_TENANT_A_ISSUER}
                registration-id: ${YUHENG_ADMIN_AUTHORITY_TENANT_A_REGISTRATION_ID}
                audience: ${TIANQUAN_SHOUBING_AUTHORITY_RESOURCE_URI}
                context: TENANT
                tenant-id: ${TIANQUAN_SHOUBING_TENANT_A_ID}
                scopes: ["tianquan-shoubing:security-state:resolve", "tianquan-shoubing:audit:append"]
              tenant-b:
                issuer: ${TIANQUAN_SHOUBING_TENANT_B_ISSUER}
                registration-id: ${YUHENG_ADMIN_AUTHORITY_TENANT_B_REGISTRATION_ID}
                audience: ${TIANQUAN_SHOUBING_AUTHORITY_RESOURCE_URI}
                context: TENANT
                tenant-id: ${TIANQUAN_SHOUBING_TENANT_B_ID}
                scopes: ["tianquan-shoubing:security-state:resolve", "tianquan-shoubing:audit:append"]
              platform:
                issuer: ${TIANQUAN_SHOUBING_PLATFORM_ISSUER}
                registration-id: ${YUHENG_ADMIN_AUTHORITY_PLATFORM_REGISTRATION_ID}
                audience: ${TIANQUAN_SHOUBING_AUTHORITY_RESOURCE_URI}
                context: PLATFORM
                scopes: ["tianquan-shoubing:security-state:resolve", "tianquan-shoubing:audit:append"]
          service-client:
            app-id: ${YUHENG_ADMIN_AUTHORITY_SERVICE_APP_ID}
          trusted-issuers:
            tenant-a:
              issuer: ${TIANQUAN_SHOUBING_TENANT_A_ISSUER}
              jwks-uri: ${TIANQUAN_SHOUBING_TENANT_A_JWKS_URI}
              realm-key: ${TIANQUAN_SHOUBING_TENANT_A_REALM_KEY}
              realm-type: TENANT
              tenant-id: ${TIANQUAN_SHOUBING_TENANT_A_ID}
              status: ACTIVE
              trust-version: ${TIANQUAN_SHOUBING_TENANT_A_TRUST_VERSION}
            tenant-b:
              issuer: ${TIANQUAN_SHOUBING_TENANT_B_ISSUER}
              jwks-uri: ${TIANQUAN_SHOUBING_TENANT_B_JWKS_URI}
              realm-key: ${TIANQUAN_SHOUBING_TENANT_B_REALM_KEY}
              realm-type: TENANT
              tenant-id: ${TIANQUAN_SHOUBING_TENANT_B_ID}
              status: ACTIVE
              trust-version: ${TIANQUAN_SHOUBING_TENANT_B_TRUST_VERSION}
            platform:
              issuer: ${TIANQUAN_SHOUBING_PLATFORM_ISSUER}
              jwks-uri: ${TIANQUAN_SHOUBING_PLATFORM_JWKS_URI}
              realm-key: platform
              realm-type: PLATFORM
              status: ACTIVE
              trust-version: ${TIANQUAN_SHOUBING_PLATFORM_TRUST_VERSION}
          issuer: ${TIANQUAN_SHOUBING_OAUTH_ISSUER}
          jwk-set-uri: ${TIANQUAN_SHOUBING_JWK_SET_URI}
        jianshen:
          user-scope-policy:
            enabled: true
            permission-scopes:
              "[yuheng:applications:write]": ["yuheng:applications:write"]
              "[yuheng:catalog:write]": ["yuheng:catalog:write"]
              "[yuheng:credentials:write]": ["yuheng:credentials:write"]
              "[yuheng:drafts:write]": ["yuheng:drafts:write"]
              "[yuheng:groups:write]": ["yuheng:groups:write"]
              "[yuheng:llm:read]": ["yuheng:llm:read"]
              "[yuheng:llm:write]": ["yuheng:llm:write"]
              "[yuheng:mcp:approve]": ["yuheng:mcp:approve"]
              "[yuheng:mcp:read]": ["yuheng:mcp:read"]
              "[yuheng:mcp:runtime:read]": ["yuheng:mcp:runtime:read"]
              "[yuheng:mcp:test]": ["yuheng:mcp:test"]
              "[yuheng:mcp:write]": ["yuheng:mcp:write"]
              "[yuheng:read]": ["yuheng:read"]
              "[yuheng:releases:write]": ["yuheng:releases:write"]
          authorization:
            endpoint: ${TIANQUAN_JIANSHEN_AUTHORIZATION_ENDPOINT:http://127.0.0.1:18130}
            service-token:
              enabled: ${YUHENG_TIANQUAN_JIANSHEN_SERVICE_TOKEN_ENABLED:false}
              resource-uri: ${YUHENG_TIANQUAN_JIANSHEN_SERVICE_TOKEN_RESOURCE_URI:}
              scopes: ${YUHENG_TIANQUAN_JIANSHEN_SERVICE_TOKEN_SCOPES:}
    component:
      tianshu:
        tenant-id: ${TIANSHU_TENANT_ID:}
        rpc:
          target: ${TIANSHU_RPC_TARGET:dns:///127.0.0.1:19080}
          tls:
            development-plaintext: ${TIANSHU_RPC_DEVELOPMENT_PLAINTEXT:false}
        redis:
          username: ${TIANSHU_REDIS_USERNAME:}
          password: ${TIANSHU_REDIS_PASSWORD:HomeLab666}
      yuheng:
        reporting:
          enabled: ${YUHENG_ADMIN_YUHENG_REPORTING_ENABLED:false}
          env: local
          namespace: default
          application-code: stellar-enclosure-yuheng-admin
          artifact-version: local

server:
  ssl:
    enabled: true
    key-store: ${YUHENG_ADMIN_TLS_KEY_STORE}
    key-store-type: PKCS12
    key-store-password: ${YUHENG_ADMIN_TLS_KEY_STORE_PASSWORD}

management.endpoint.health.group.readiness.include: ["readinessState", "gatewayAdminAuditReadiness"]
