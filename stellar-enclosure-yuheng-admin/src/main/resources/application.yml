spring:
  http:
    converters:
      preferred-json-mapper: jackson2
    codecs:
      preferred-json-mapper: jackson2
  application:
    name: stellar-enclosure-yuheng-admin
  profiles:
    default: local
  config:
    import:
      - optional:file:${UNIFIED_XINGYUAN_RUNTIME_DIR:target/local-unified-xingyuan}/env/stellar-enclosure-yuheng-admin.properties
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV4
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  flyway:
    enabled: false

server:
  ssl:
    enabled: true
    key-store: ${YUHENG_ADMIN_TLS_KEY_STORE}
    key-store-type: PKCS12
    key-store-password: ${YUHENG_ADMIN_TLS_KEY_STORE_PASSWORD}
  address: 0.0.0.0
  port: ${YUHENG_ADMIN_PORT:8080}
  shutdown: graceful

springdoc:
  api-docs:
    enabled: ${YUHENG_ADMIN_HTTP_OPENAPI_ENABLED:false}
    version: OPENAPI_3_1
  group-configs:
    - group: stellar-enclosure-yuheng-admin
      paths-to-match:
        - /api/v1/yuheng/admin/**
        - /api/v1/auth/bootstrap

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

yuheng:
  admin:
    mcp:
      si-reader:
        enabled: ${YUHENG_MCP_SI_READER_ENABLED:false}
    exposure:
      role: ADMIN
      api-server: ${YUHENG_PUBLISHER_API_SERVER:}
      ca-file: ${YUHENG_PUBLISHER_CA_FILE:}
      token-file: ${YUHENG_PUBLISHER_TOKEN_FILE:}
      request-timeout: ${YUHENG_PUBLISHER_REQUEST_TIMEOUT:5s}
      max-response-bytes: ${YUHENG_PUBLISHER_MAX_RESPONSE_BYTES:1048576}
    cache:
      redis:
        address: ${YUHENG_ADMIN_CACHE_REDIS_ADDRESS}
        database: ${YUHENG_ADMIN_CACHE_REDIS_DATABASE:0}
        password-file: ${YUHENG_ADMIN_CACHE_REDIS_PASSWORD_FILE:}
    transport-security:
      mode: MTLS
    openapi:
      enabled: ${YUHENG_ADMIN_OPENAPI_ENABLED:false}
      allow-development-http: ${YUHENG_ADMIN_OPENAPI_ALLOW_DEVELOPMENT_HTTP:false}
      reconcile-delay: ${YUHENG_ADMIN_OPENAPI_RECONCILE_DELAY:PT30S}
      batch-size: ${YUHENG_ADMIN_OPENAPI_BATCH_SIZE:50}
      maximum-instance-attempts: ${YUHENG_ADMIN_OPENAPI_MAX_INSTANCE_ATTEMPTS:3}
      claim-timeout: ${YUHENG_ADMIN_OPENAPI_CLAIM_TIMEOUT:PT2M}
      connect-timeout: ${YUHENG_ADMIN_OPENAPI_CONNECT_TIMEOUT:PT3S}
      read-timeout: ${YUHENG_ADMIN_OPENAPI_READ_TIMEOUT:PT10S}
      maximum-document-bytes: ${YUHENG_ADMIN_OPENAPI_MAX_DOCUMENT_BYTES:5242880}
      maximum-operations: ${YUHENG_ADMIN_OPENAPI_MAX_OPERATIONS:5000}
      maximum-schema-nodes: ${YUHENG_ADMIN_OPENAPI_MAX_SCHEMA_NODES:50000}
      maximum-ref-depth: ${YUHENG_ADMIN_OPENAPI_MAX_REF_DEPTH:64}
      retry-initial-delay: ${YUHENG_ADMIN_OPENAPI_RETRY_INITIAL_DELAY:PT5S}
      retry-maximum-delay: ${YUHENG_ADMIN_OPENAPI_RETRY_MAXIMUM_DELAY:PT5M}
      retry-jitter: ${YUHENG_ADMIN_OPENAPI_RETRY_JITTER:0.20}
      drift-sample-interval: ${YUHENG_ADMIN_OPENAPI_DRIFT_SAMPLE_INTERVAL:PT5M}
      allowed-cidrs:
        - ${YUHENG_ADMIN_OPENAPI_ALLOWED_CIDR:}
      required-scope: ${YUHENG_ADMIN_OPENAPI_REQUIRED_SCOPE:yuheng.openapi.read}
    observability:
      retention: 168h
      kafka:
        enabled: false
        topic: egon.yuheng.call.v1
        group-id: stellar-enclosure-yuheng-admin-call-events-v1

egon:
  cola:
    platform:
      tianquan:
        shoubing:
          usage-observation:
            enabled: true
            receiver: YUHENG_ADMIN
            fallback-issuer: ${TIANQUAN_SHOUBING_OAUTH_ISSUER}
            allow-local-plaintext: false
          authority:
            base-uri: ${TIANQUAN_SHOUBING_AUTHORITY_BASE_URI}
            timeout: PT2S
            bindings:
              tenant-a:
                issuer: ${TIANQUAN_SHOUBING_TENANT_A_ISSUER}
                registration-id: ${YUHENG_ADMIN_AUTHORITY_TENANT_A_REGISTRATION_ID}
                audience: ${TIANQUAN_SHOUBING_AUTHORITY_RESOURCE_URI}
                context: TENANT
                tenant-id: ${TIANQUAN_SHOUBING_TENANT_A_ID}
                scopes: ["tianquan-shoubing:security-state:resolve", "tianquan-shoubing:audit:append"]
              tenant-b:
                issuer: ${TIANQUAN_SHOUBING_TENANT_B_ISSUER}
                registration-id: ${YUHENG_ADMIN_AUTHORITY_TENANT_B_REGISTRATION_ID}
                audience: ${TIANQUAN_SHOUBING_AUTHORITY_RESOURCE_URI}
                context: TENANT
                tenant-id: ${TIANQUAN_SHOUBING_TENANT_B_ID}
                scopes: ["tianquan-shoubing:security-state:resolve", "tianquan-shoubing:audit:append"]
              platform:
                issuer: ${TIANQUAN_SHOUBING_PLATFORM_ISSUER}
                registration-id: ${YUHENG_ADMIN_AUTHORITY_PLATFORM_REGISTRATION_ID}
                audience: ${TIANQUAN_SHOUBING_AUTHORITY_RESOURCE_URI}
                context: PLATFORM
                scopes: ["tianquan-shoubing:security-state:resolve", "tianquan-shoubing:audit:append"]
          service-client:
            app-id: ${YUHENG_ADMIN_AUTHORITY_SERVICE_APP_ID}
          trusted-issuers:
            tenant-a:
              issuer: ${TIANQUAN_SHOUBING_TENANT_A_ISSUER}
              jwks-uri: ${TIANQUAN_SHOUBING_TENANT_A_JWKS_URI}
              realm-key: ${TIANQUAN_SHOUBING_TENANT_A_REALM_KEY}
              realm-type: TENANT
              tenant-id: ${TIANQUAN_SHOUBING_TENANT_A_ID}
              status: ACTIVE
              trust-version: ${TIANQUAN_SHOUBING_TENANT_A_TRUST_VERSION}
            tenant-b:
              issuer: ${TIANQUAN_SHOUBING_TENANT_B_ISSUER}
              jwks-uri: ${TIANQUAN_SHOUBING_TENANT_B_JWKS_URI}
              realm-key: ${TIANQUAN_SHOUBING_TENANT_B_REALM_KEY}
              realm-type: TENANT
              tenant-id: ${TIANQUAN_SHOUBING_TENANT_B_ID}
              status: ACTIVE
              trust-version: ${TIANQUAN_SHOUBING_TENANT_B_TRUST_VERSION}
            platform:
              issuer: ${TIANQUAN_SHOUBING_PLATFORM_ISSUER}
              jwks-uri: ${TIANQUAN_SHOUBING_PLATFORM_JWKS_URI}
              realm-key: platform
              realm-type: PLATFORM
              status: ACTIVE
              trust-version: ${TIANQUAN_SHOUBING_PLATFORM_TRUST_VERSION}
          enabled: ${UNIFIED_IDENTITY_ENABLED:true}
          register-filter: false
          issuer: ${TIANQUAN_SHOUBING_OAUTH_ISSUER}
          jwk-set-uri: ${TIANQUAN_SHOUBING_JWK_SET_URI}
          resource-server-id: ${YUHENG_ADMIN_RESOURCE_SERVER_ID}
          resource-uri: ${YUHENG_ADMIN_RESOURCE_URI}
        jianshen:
          user-scope-policy:
            enabled: true
            permission-scopes:
              "[yuheng:applications:write]": ["yuheng:applications:write"]
              "[yuheng:catalog:write]": ["yuheng:catalog:write"]
              "[yuheng:credentials:write]": ["yuheng:credentials:write"]
              "[yuheng:drafts:write]": ["yuheng:drafts:write"]
              "[yuheng:exposures:write]": ["yuheng:exposures:write"]
              "[yuheng:exposures:reopen]": ["yuheng:exposures:reopen"]
              "[yuheng:groups:write]": ["yuheng:groups:write"]
              "[yuheng:llm:read]": ["yuheng:llm:read"]
              "[yuheng:llm:write]": ["yuheng:llm:write"]
              "[yuheng:mcp:approve]": ["yuheng:mcp:approve"]
              "[yuheng:mcp:read]": ["yuheng:mcp:read"]
              "[yuheng:mcp:runtime:read]": ["yuheng:mcp:runtime:read"]
              "[yuheng:mcp:test]": ["yuheng:mcp:test"]
              "[yuheng:mcp:write]": ["yuheng:mcp:write"]
              "[yuheng:read]": ["yuheng:read"]
              "[yuheng:releases:write]": ["yuheng:releases:write"]
          enabled: ${UNIFIED_IDENTITY_ENABLED:true}
          register-filter: false
          system-code: stellar-enclosure-yuheng-admin
          authorization:
            endpoint: ${TIANQUAN_JIANSHEN_AUTHORIZATION_ENDPOINT}
            service-token:
              enabled: ${YUHENG_TIANQUAN_JIANSHEN_SERVICE_TOKEN_ENABLED:true}
              resource-uri: ${YUHENG_TIANQUAN_JIANSHEN_SERVICE_TOKEN_RESOURCE_URI}
              scopes: ${YUHENG_TIANQUAN_JIANSHEN_SERVICE_TOKEN_SCOPES}
    component:
      transactional-outbox:
        enabled: true
        polling:
          enabled: false
        cleanup:
          enabled: false
        storage:
          type: MYBATIS_PLUS
          data-source-bean-name: dataSource
          transaction-manager-bean-name: gatewayTransactionManager
          validate-schema: true
          mp:
            sql-session-factory-bean-name: sqlSessionFactory
            auto-initialize-ddl: true
            migration-mode: false
            manifest-resource: db/egon-outbox-mp/manifest.json
            previous-route-fingerprints: []
        http:
          enabled: false
        rabbitmq:
          enabled: false
      mybatis-plus:
        tenant-id:
          ignored-tables: [egon_cola_outbox_message]
      rpc:
        transport: h2c
      tianshu:
        enabled: false
      yuheng:
        openapi:
          enabled: ${YUHENG_ADMIN_HTTP_OPENAPI_ENABLED:false}
          published-groups:
            - stellar-enclosure-yuheng-admin
          biz-code: ${YUHENG_ADMIN_RESOURCE_BIZ_CODE:xingyuan}
          application-code: ${YUHENG_ADMIN_RESOURCE_APP_CODE:stellar-enclosure-yuheng-admin}
          resource-uri: ${YUHENG_ADMIN_RESOURCE_URI:}
          artifact-version: ${YUHENG_ADMIN_VERSION:local}
          build-id: ${YUHENG_ADMIN_BUILD_ID:local}
        reporting:
          enabled: ${YUHENG_ADMIN_YUHENG_REPORTING_ENABLED:false}
          admin-base-url: ${YUHENG_ADMIN_BASE_URL:}
          biz-code: ${YUHENG_ADMIN_RESOURCE_BIZ_CODE:xingyuan}
          application-code: ${YUHENG_ADMIN_RESOURCE_APP_CODE:stellar-enclosure-yuheng-admin}
          application-name: Yuheng Admin
          env: ${DEPLOYMENT_ENV:local}
          namespace: ${DEPLOYMENT_NAMESPACE:default}
          artifact-version: ${YUHENG_ADMIN_VERSION:local}
          build-id: ${YUHENG_ADMIN_BUILD_ID:local}
          declared-hosts: ${YUHENG_ADMIN_DECLARED_HOSTS:127.0.0.1}
          fail-fast: true
          access-key: ${YUHENG_REPORT_ACCESS_KEY:}
          secret-key: ${YUHENG_REPORT_SECRET_KEY:}
          state-file: ${YUHENG_REPORT_STATE_FILE:}

management.endpoint.health.group.readiness.include: ["readinessState", "gatewayAdminAuditReadiness"]
