spring:
  http:
    converters:
      preferred-json-mapper: jackson2
    codecs:
      preferred-json-mapper: jackson2
  application:
    name: stellar-enclosure-yuheng-test-http-provider
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${TIANQUAN_SHOUBING_JWK_SET_URI}
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV4

server:
  port: 0
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

yuheng:
  test:
    service-version: ${YUHENG_TEST_SERVICE_VERSION:1.0.0-live}

springdoc:
  api-docs:
    enabled: true
    version: OPENAPI_3_1
  group-configs:
    - group: orders
      paths-to-match:
        - /api/orders/**
        - /api/slow/**
        - /api/fail/**
        - /api/body/**
        - /api/providers/**
    - group: inventory
      paths-to-match:
        - /api/internal/inventory/**

egon:
  cola:
    component:
      id:
        enabled: false
      yuheng:
        openapi:
          enabled: true
          published-groups:
            - orders
            - inventory
          biz-code: ${YUHENG_TEST_BIZ_CODE:stellar-enclosure-yuheng-test}
          application-code: stellar-enclosure-yuheng-test-http-provider
          resource-uri: ${YUHENG_TEST_RESOURCE_URI:https://stellar-enclosure-yuheng-test-http-provider.example.test}
          artifact-version: ${yuheng.test.service-version}
          build-id: ${YUHENG_TEST_BUILD_ID:local-http}
