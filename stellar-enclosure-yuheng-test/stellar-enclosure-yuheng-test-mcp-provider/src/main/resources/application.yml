spring:
  http:
    converters:
      preferred-json-mapper: jackson2
    codecs:
      preferred-json-mapper: jackson2
  application:
    name: stellar-enclosure-yuheng-test-mcp-provider
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${TIANQUAN_SHOUBING_JWK_SET_URI}
  config:
    import:
      - optional:file:${UNIFIED_XINGYUAN_RUNTIME_DIR:target/local-unified-xingyuan}/env/mcp-provider.properties
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV4

server:
  port: ${MCP_TEST_PROVIDER_PORT:18150}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: true
    version: OPENAPI_3_1
  group-configs:
    - group: jobs
      paths-to-match:
        - /api/mcp-fixtures/**

egon:
  cola:
    platform:
      tianquan:
        shoubing:
          enabled: true
          register-filter: false
          issuer: ${TIANQUAN_SHOUBING_OAUTH_ISSUER}
          jwk-set-uri: ${TIANQUAN_SHOUBING_JWK_SET_URI}
          resource-server-id: ${MCP_PROVIDER_RESOURCE_SERVER_ID:}
          resource-uri: ${MCP_PROVIDER_RESOURCE_URI:}
        jianshen:
          enabled: true
          register-filter: false
          system-code: mock-backend
          runtime:
            redis-enabled: true
            redis-address: ${MCP_PROVIDER_REDIS_ADDRESS:redis://127.0.0.1:6379}
            database: ${MCP_PROVIDER_REDIS_DATABASE:8}
            password-file: ${MCP_PROVIDER_REDIS_PASSWORD_FILE:}
          authorization:
            endpoint: ${TIANQUAN_JIANSHEN_AUTHORIZATION_ENDPOINT:http://127.0.0.1:18130}
    component:
      id:
        enabled: false
      yuheng:
        openapi:
          enabled: true
          published-groups:
            - jobs
          biz-code: ${MCP_PROVIDER_BIZ_CODE:test-biz}
          application-code: stellar-enclosure-yuheng-test-mcp-provider
          resource-uri: ${MCP_PROVIDER_RESOURCE_URI:https://api.egon.internal/local/stellar-enclosure-yuheng-test-mcp-provider}
          artifact-version: 1.0.0
          build-id: ${MCP_TEST_PROVIDER_BUILD_ID:local}
