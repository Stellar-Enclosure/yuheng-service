spring:
  http:
    converters:
      preferred-json-mapper: jackson2
    codecs:
      preferred-json-mapper: jackson2
  application:
    name: stellar-enclosure-yuheng-test-rpc-consumer
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV4

server:
  port: 0
  shutdown: graceful

management:
  endpoint:
    health:
      probes:
        enabled: true

egon:
  cola:
    component:
      id:
        enabled: false
      rpc:
        enabled: ${YUHENG_RPC_FIXTURE_ENABLED:false}
        transport: h2c
        provider:
          enabled: false
        consumer:
          enabled: ${YUHENG_RPC_FIXTURE_ENABLED:false}
          default-timeout-ms: 3000
          bindings:
            echo-fixture:
              version: 1
              namespace: ${YUHENG_RPC_FIXTURE_NAMESPACE}
              service: ${YUHENG_RPC_FIXTURE_SERVICE}
              port: ${YUHENG_RPC_FIXTURE_PORT}
              methods:
                - egon.yuheng.test.v1.EchoService/Echo
            order-fixture:
              version: 1
              namespace: ${YUHENG_RPC_FIXTURE_NAMESPACE}
              service: ${YUHENG_RPC_FIXTURE_SERVICE}
              port: ${YUHENG_RPC_FIXTURE_PORT}
              methods:
                - egon.yuheng.test.v1.OrderService/GetOrder
                - egon.yuheng.test.v1.OrderService/CreateOrder
                - egon.yuheng.test.v1.OrderService/SlowCall
                - egon.yuheng.test.v1.OrderService/Fail
