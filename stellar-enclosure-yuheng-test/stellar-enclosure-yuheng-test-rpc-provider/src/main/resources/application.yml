spring:
  http:
    converters:
      preferred-json-mapper: jackson2
    codecs:
      preferred-json-mapper: jackson2
  application:
    name: stellar-enclosure-yuheng-test-rpc-provider
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV4

server:
  port: 0
  shutdown: graceful

management:
  endpoint:
    health:
      probes:
        enabled: true

egon:
  cola:
    component:
      id:
        enabled: false
      rpc:
        enabled: false
        transport: h2c
        provider:
          enabled: false
      yuheng:
        reporting:
          enabled: false
