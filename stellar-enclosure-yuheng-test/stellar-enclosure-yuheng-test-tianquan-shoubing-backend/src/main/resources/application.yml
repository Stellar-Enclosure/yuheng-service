spring:
  http:
    converters:
      preferred-json-mapper: jackson2
    codecs:
      preferred-json-mapper: jackson2
  application:
    name: stellar-enclosure-yuheng-test-tianquan-shoubing-backend
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${TIANQUAN_SHOUBING_JWK_SET_URI}
  config:
    import:
      - optional:file:${UNIFIED_XINGYUAN_RUNTIME_DIR:target/local-unified-xingyuan}/env/mock-backend.properties
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV4

server:
  port: ${MOCK_BACKEND_PORT:18160}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: true
    version: OPENAPI_3_1
  group-configs:
    - group: identity
      paths-to-match:
        - /api/mock/**

egon:
  cola:
    platform:
      tianquan:
        shoubing:
          enabled: true
          register-filter: false
          issuer: ${TIANQUAN_SHOUBING_OAUTH_ISSUER}
          jwk-set-uri: ${TIANQUAN_SHOUBING_JWK_SET_URI}
          resource-server-id: ${MOCK_BACKEND_RESOURCE_SERVER_ID:identity-mock-backend-local}
          resource-uri: ${MOCK_BACKEND_RESOURCE_URI:https://api.egon.internal/local/identity/mock-backend}
        jianshen:
          enabled: true
          register-filter: false
          system-code: mock-backend
          runtime:
            redis-enabled: true
            redis-address: ${MOCK_BACKEND_REDIS_ADDRESS:redis://127.0.0.1:6379}
            database: ${MOCK_BACKEND_REDIS_DATABASE:0}
          authorization:
            endpoint: ${TIANQUAN_JIANSHEN_AUTHORIZATION_ENDPOINT:http://127.0.0.1:18130}
    component:
      id:
        enabled: false
      yuheng:
        openapi:
          enabled: true
          published-groups:
            - identity
          biz-code: ${MOCK_BACKEND_RESOURCE_BIZ_CODE:identity}
          application-code: ${MOCK_BACKEND_RESOURCE_APP_CODE:mock-backend}
          resource-uri: ${MOCK_BACKEND_RESOURCE_URI:https://api.egon.internal/local/identity/mock-backend}
          artifact-version: ${MOCK_BACKEND_ARTIFACT_VERSION:0.0.1}
          build-id: ${MOCK_BACKEND_BUILD_ID:local}
