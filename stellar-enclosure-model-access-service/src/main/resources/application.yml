spring:
  application:
    name: stellar-enclosure-model-access-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  http:
    converters:
      preferred-json-mapper: jackson2
    codecs:
      preferred-json-mapper: jackson2
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV4
  flyway:
    enabled: false

springdoc:
  api-docs:
    enabled: ${YUHENG_LLM_OPENAPI_ENABLED:false}
    version: OPENAPI_3_1
  group-configs:
    - group: yuheng-llm
      paths-to-match:
        - /v1/**

egon:
  cola:
    platform:
      tianquan:
        shoubing:
          enabled: true
          register-filter: false
          rpc:
            enabled: false
            consumer:
              enabled: false
            provider:
              enabled: false
          issuer: ${TIANQUAN_SHOUBING_OAUTH_ISSUER}
          jwk-set-uri: ${TIANQUAN_SHOUBING_JWK_SET_URI}
          resource-server-id: ${YUHENG_LLM_RESOURCE_SERVER_ID}
          resource-uri: ${YUHENG_LLM_RESOURCE_URI}
          authority:
            base-uri: ${TIANQUAN_SHOUBING_AUTHORITY_BASE_URI}
            timeout: PT2S
            bindings:
              platform:
                issuer: ${TIANQUAN_SHOUBING_PLATFORM_OAUTH_ISSUER}
                registration-id: ${YUHENG_LLM_AUTHORITY_PLATFORM_REGISTRATION_ID}
                audience: ${TIANQUAN_SHOUBING_AUTHORITY_RESOURCE_URI}
                context: PLATFORM
                scopes: ["tianquan-shoubing:security-state:resolve", "tianquan-shoubing:audit:append"]
              tenant-a:
                issuer: ${TIANQUAN_SHOUBING_OAUTH_ISSUER}
                registration-id: ${YUHENG_LLM_AUTHORITY_TENANT_A_REGISTRATION_ID}
                audience: ${TIANQUAN_SHOUBING_AUTHORITY_RESOURCE_URI}
                context: TENANT
                tenant-id: ${TIANSHU_TENANT_ID}
                scopes: ["tianquan-shoubing:security-state:resolve", "tianquan-shoubing:audit:append"]
          service-client:
            app-id: ${YUHENG_LLM_AUTHORITY_SERVICE_APP_ID}
          trusted-issuers:
            platform:
              issuer: ${TIANQUAN_SHOUBING_PLATFORM_OAUTH_ISSUER}
              jwks-uri: ${TIANQUAN_SHOUBING_PLATFORM_JWK_SET_URI}
              realm-key: platform
              realm-type: PLATFORM
              status: ACTIVE
              trust-version: 1
            tenant-a:
              issuer: ${TIANQUAN_SHOUBING_OAUTH_ISSUER}
              jwks-uri: ${TIANQUAN_SHOUBING_JWK_SET_URI}
              realm-key: ${TIANQUAN_SHOUBING_TENANT_REALM_KEY}
              realm-type: TENANT
              tenant-id: ${TIANSHU_TENANT_ID}
              status: ACTIVE
              trust-version: 1
          usage-observation:
            enabled: true
            receiver: LLM
            fallback-issuer: ${TIANQUAN_SHOUBING_OAUTH_ISSUER}
            allow-local-plaintext: false
        jianshen:
          enabled: false
          register-filter: false
    component:
      cache:
        enabled: false
      id:
        enabled: false
      rpc:
        enabled: false
        consumer:
          enabled: false
        provider:
          enabled: false
      mybatis-plus:
        ddl:
          enabled: false
      yuheng:
        openapi:
          enabled: ${YUHENG_LLM_OPENAPI_ENABLED:false}
          publish-to-ddc: false
          published-groups:
            - yuheng-llm
          biz-code: ${YUHENG_LLM_OPENAPI_BIZ_CODE:}
          application-code: ${YUHENG_LLM_OPENAPI_APPLICATION_CODE:}
          resource-uri: ${YUHENG_LLM_OPENAPI_RESOURCE_URI:}
          artifact-version: ${YUHENG_LLM_OPENAPI_ARTIFACT_VERSION:}
          build-id: ${YUHENG_LLM_OPENAPI_BUILD_ID:}

mybatis-plus:
  mapper-locations: 'classpath*:/mybatis/mapper/llm/*.xml'

server:
  port: ${YUHENG_LLM_PORT:8080}
  forward-headers-strategy: none
  ssl:
    enabled: false
  shutdown: graceful
management:
  server:
    port: ${YUHENG_LLM_MANAGEMENT_PORT:8081}
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,llmAuditReadiness,llmPolicyReadiness

yuheng:
  persistence:
    tenant-id: ${YUHENG_PERSISTENCE_TENANT_ID}
    identity-tenant-id: ${YUHENG_PERSISTENCE_IDENTITY_TENANT_ID}
    service-user-id: ${YUHENG_PERSISTENCE_SERVICE_USER_ID}
    expected-schema-version: ${YUHENG_PERSISTENCE_EXPECTED_SCHEMA_VERSION}
    expected-schema-sha256: ${YUHENG_PERSISTENCE_EXPECTED_SCHEMA_SHA256}
    managed-ddl-enabled: false
  llm:
    cache:
      enabled: ${YUHENG_LLM_CACHE_ENABLED:false}
      timeout-ms: ${YUHENG_LLM_CACHE_TIMEOUT_MS:200}
      semantic-max-entries: ${YUHENG_LLM_CACHE_SEMANTIC_MAX_ENTRIES:2000}
      redis:
        address: ${YUHENG_LLM_CACHE_REDIS_ADDRESS}
        database: ${YUHENG_LLM_CACHE_REDIS_DATABASE:0}
        password-file: ${YUHENG_LLM_CACHE_REDIS_PASSWORD_FILE:}
