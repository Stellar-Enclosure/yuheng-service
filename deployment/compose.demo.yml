services:
  http-provider-mvc:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.test-app
      args:
        APP_JAR: stellar-enclosure-yuheng-test/stellar-enclosure-yuheng-test-http-provider/target/stellar-enclosure-yuheng-test-http-provider-exec.jar
    env_file:
      - path: .demo/http-provider.env
        required: false
    environment:
      SERVER_PORT: 18080
      MANAGEMENT_SERVER_PORT: 18081
      YUHENG_TEST_PROVIDER_ID: http-provider-mvc-demo
      YUHENG_TEST_SERVICE_VERSION: ${DEMO_SERVICE_VERSION:-1.0.0-demo}

  http-provider-webflux:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.test-app
      args:
        APP_JAR: stellar-enclosure-yuheng-test/stellar-enclosure-yuheng-test-webflux-http-provider/target/stellar-enclosure-yuheng-test-webflux-http-provider-exec.jar
    env_file:
      - path: .demo/webflux-http-provider.env
        required: false
    environment:
      SERVER_PORT: 18080
      MANAGEMENT_SERVER_PORT: 18081
      YUHENG_TEST_PROVIDER_ID: http-provider-webflux-demo
      YUHENG_TEST_SERVICE_VERSION: ${DEMO_SERVICE_VERSION:-1.0.0-demo}

  rpc-provider:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.test-app
      args:
        APP_JAR: stellar-enclosure-yuheng-test/stellar-enclosure-yuheng-test-rpc-provider/target/stellar-enclosure-yuheng-test-rpc-provider-exec.jar
    env_file:
      - path: .demo/rpc-provider.env
        required: false
    environment:
      SERVER_PORT: 18080
      MANAGEMENT_SERVER_PORT: 18081
      EGON_COLA_COMPONENT_RPC_ENABLED: "true"
      EGON_COLA_COMPONENT_RPC_TRANSPORT: h2c
      EGON_COLA_COMPONENT_RPC_PROVIDER_ENABLED: "true"
      EGON_COLA_COMPONENT_RPC_PROVIDER_PORT: 19091
    networks:
      default:
        aliases: [rpc-provider.fixture.svc.cluster.local]

  rpc-consumer:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.test-app
      args:
        APP_JAR: stellar-enclosure-yuheng-test/stellar-enclosure-yuheng-test-rpc-consumer/target/stellar-enclosure-yuheng-test-rpc-consumer-exec.jar
    env_file:
      - path: .demo/rpc-consumer.env
        required: false
    environment:
      SERVER_PORT: 18080
      MANAGEMENT_SERVER_PORT: 18081
      YUHENG_RPC_FIXTURE_ENABLED: "true"
      YUHENG_RPC_FIXTURE_NAMESPACE: fixture
      YUHENG_RPC_FIXTURE_SERVICE: rpc-provider
      YUHENG_RPC_FIXTURE_PORT: 19091
    depends_on:
      rpc-provider:
        condition: service_started
