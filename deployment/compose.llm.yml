services:
  stellar-enclosure-model-access-service:
    profiles: [llm]
    build:
      context: ..
      dockerfile: deployment/Dockerfile.test-app
      args:
        APP_JAR: stellar-enclosure-model-access-service/target/stellar-enclosure-model-access-service-exec.jar
    environment:
      YUHENG_LLM_PORT: 8080
      YUHENG_LLM_MANAGEMENT_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gateway_admin
      SPRING_DATASOURCE_USERNAME: yuheng
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/run/egon-config/
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      YUHENG_LLM_SECRETS_ROOT: /run/fixture-provider-versions
    secrets:
      - source: postgres-password
        target: spring.datasource.password
    volumes:
      - type: bind
        source: ${YUHENG_MODEL_FIXTURE_CONFIG_DIR:?set the model fixture configuration directory}
        target: /run/egon-config
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${YUHENG_MODEL_FIXTURE_PROVIDER_VERSION_DIR:?set the model fixture provider version directory}
        target: /run/fixture-provider-versions
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8081;
          printf "GET /actuator/health/readiness HTTP/1.0\r\n\r\n" >&3;
          grep -q " 200 " <&3'
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 60s
